version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koa-api
    ports:
      - "3333:3333"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    depends_on:
      - db
    command: >
      sh -c "until pg_isready -h ${DB_HOST} -p ${DB_PORT}; do echo waiting for db; sleep 2; done;
      yarn build && yarn typeorm migration:run -d dist/src/infrastructure/database/typeorm/index.js && yarn start"
    networks:
      - app-network
  db:
    image: postgres:15-alpine
    container_name: postgres-caveo
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
