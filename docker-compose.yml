services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koa-api
    ports:
      - "3333:3333"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_123
      DB_DATABASE: caveo
    depends_on:
      - db
    command: >
      sh -c "until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done;
      yarn build && yarn typeorm migration:run -d dist/infrastructure/database/typeorm/index.js && yarn start"
    networks:
      - app-network
  db:
    image: postgres:15-alpine
    container_name: postgres-caveo
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_123
      POSTGRES_DB: caveo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
